<!DOCTYPE html>
<html lang="utf-8">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北寻小站</title>
    <link rel="icon" href="./icon.png" type="image/png">
    <style>
        /* --- 全局重置与基础样式 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --glass-bg:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.18),
                    rgba(255,255,255,0.06)
                );

            --glass-border:
                rgba(255,255,255,0.28);

            --glass-shadow:
                0 8px 32px rgba(0,0,0,0.25),
                inset 0 1px rgba(255,255,255,0.35),
                inset 0 -1px rgba(255,255,255,0.08);

            --glass-blur: 30px;
        }

        body {
            background-image: url('./background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            padding-bottom: 120px;
        }

        .info_text {
            padding: 100px;
            justify-content: center; /* 水平居中 */
            align-items: center;     /* 垂直居中 */
            text-align: center;      /* 防止文字太长换行时依然保持居中 */
        }

        /* --- 页脚样式 --- */
        .footer {
            position: fixed;
            bottom: 20px;
            /* 使用 Flexbox 居中 */
            left: 0;
            right: 0;
            width: 80%;
            max-width: 1200px;
            margin: 0 auto; /* 水平居中关键 */
            max-width: 1200px; /* 最大宽度限制 */
            padding: 15px 20px;
            /* 液态玻璃效果 */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(30px) saturate(180%) brightness(110%);
            -webkit-backdrop-filter: blur(30px) saturate(180%) brightness(110%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50px; /* 椭圆形关键属性 */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px rgba(255, 255, 255, 0.35);
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            z-index: 114514;
            overflow: hidden;
            /* 应用动画 */
            animation: footerInFromTop 2s cubic-bezier(0.5, 1.1, 0.5, 1.3) forwards;
        }

        .footer::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.05) 35%, transparent 70%);
            pointer-events: none;
        }

        .footer::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 40%;

            background:
                linear-gradient(
                    to bottom,
                    rgba(255,255,255,0.35),
                    rgba(255,255,255,0.08),
                    transparent
                );

            pointer-events: none;
        }
    </style>
    <script>
        // 动态显示当前年份
        document.addEventListener("DOMContentLoaded", function() {
            var currentYear = new Date().getFullYear();
            document.getElementById('currentYear').textContent = currentYear;
        });
    </script>
</head>

    </div>

    </div>
</html>
